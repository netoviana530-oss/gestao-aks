<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gestão AKS">
<meta name="theme-color" content="#111827">
<title>Gestão AKS</title>
<style>
  :root{
    --bg:#f3f4f6; --surface:#ffffff; --surface-2:#f8fafc;
    --ink:#111827; --muted:#64748b; --line:#e5e7eb;
    --primary:#0f766e; --primary-ink:#0b5e57; --primary-soft:#ccece7;
    --blue:#2563eb; --blue-soft:#dbeafe;
    --amber:#b45309; --amber-soft:#fef0d9;
    --green:#15803d; --green-soft:#dcfce7;
    --red:#dc2626; --red-soft:#fee2e2;
    --slate:#334155; --slate-soft:#e2e8f0;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --radius:14px; --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:var(--ui); background:var(--bg); color:var(--ink);
    font-size:15px; line-height:1.4; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  header{
    position:sticky; top:0; z-index:40;
    background:#111827; color:#fff;
    padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex; align-items:center; gap:12px;
  }
  header .brand{font-weight:800; letter-spacing:.5px; font-size:15px}
  header .brand span{color:#5eead4}
  header .ttl{margin-left:auto; font-size:12px; text-transform:uppercase; letter-spacing:1.2px; color:#94a3b8}
  header .gear{background:rgba(255,255,255,.08); border:none; color:#e2e8f0; width:34px;height:34px;border-radius:9px;font-size:16px}
  main{max-width:720px; margin:0 auto; padding:14px 14px 24px}
  .eyebrow{font-size:11px; text-transform:uppercase; letter-spacing:1.4px; color:var(--muted); font-weight:700; margin:2px 0 10px}
  .card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); padding:14px; margin-bottom:12px}
  .row{display:flex; align-items:center; gap:10px}
  .between{justify-content:space-between}
  .wrap{flex-wrap:wrap}
  .muted{color:var(--muted)}
  .small{font-size:12.5px}
  .fig{font-family:var(--mono); font-variant-numeric:tabular-nums}
  h2.title{font-size:20px; font-weight:800; letter-spacing:-.3px; margin:2px 0 2px}
  h3{font-size:15px; margin:0 0 4px; font-weight:700}
  .chip{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; white-space:nowrap}
  .c-blue{background:var(--blue-soft); color:var(--blue)}
  .c-amber{background:var(--amber-soft); color:var(--amber)}
  .c-green{background:var(--green-soft); color:var(--green)}
  .c-red{background:var(--red-soft); color:var(--red)}
  .c-slate{background:var(--slate-soft); color:var(--slate)}
  .c-teal{background:var(--primary-soft); color:var(--primary-ink)}
  button{font-family:var(--ui); cursor:pointer}
  .btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:11px 14px; border-radius:11px; font-weight:600; font-size:14px; display:inline-flex; align-items:center; justify-content:center; gap:7px; min-height:44px}
  .btn:active{transform:scale(.98)}
  .btn.primary{background:var(--primary); border-color:var(--primary); color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:7px 11px; min-height:36px; font-size:13px; border-radius:9px}
  .btn.block{width:100%}
  .btn.danger{color:var(--red); border-color:var(--red-soft)}
  .btn.wa{background:#25d366; border-color:#25d366; color:#04361a}
  .btn-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px}
  .fab{position:fixed; right:16px; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:35; background:var(--primary); color:#fff; border:none; width:56px; height:56px; border-radius:50%; font-size:28px; box-shadow:0 6px 18px rgba(15,118,110,.4)}
  nav.tabs{position:fixed; bottom:0; left:0; right:0; z-index:40; background:rgba(255,255,255,.92); backdrop-filter:blur(12px); border-top:1px solid var(--line); display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
  nav.tabs button{flex:1; background:none; border:none; color:var(--muted); font-size:10.5px; font-weight:600; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px; border-radius:10px}
  nav.tabs button .ic{font-size:20px; line-height:1}
  nav.tabs button.active{color:var(--primary)}
  label.f{display:block; font-size:12px; font-weight:700; color:var(--slate); margin:10px 0 5px; text-transform:uppercase; letter-spacing:.5px}
  input,select,textarea{width:100%; font-family:var(--ui); font-size:16px; padding:11px 12px; border:1px solid var(--line); border-radius:10px; background:var(--surface); color:var(--ink)}
  input:focus,select:focus,textarea:focus{outline:2px solid var(--primary-soft); border-color:var(--primary)}
  textarea{min-height:70px; resize:vertical}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .checks{display:flex; flex-wrap:wrap; gap:7px; margin-top:4px}
  .checks label{display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; background:var(--surface-2); border:1px solid var(--line); padding:8px 11px; border-radius:9px; text-transform:none; letter-spacing:0; margin:0; color:var(--ink)}
  .checks input{width:auto}
  .overlay{position:fixed; inset:0; z-index:60; background:var(--bg); overflow-y:auto; -webkit-overflow-scrolling:touch}
  .overlay .obar{position:sticky; top:0; background:#111827; color:#fff; display:flex; align-items:center; gap:12px; padding:calc(env(safe-area-inset-top) + 12px) 14px 12px; z-index:2}
  .overlay .obar h3{color:#fff; margin:0; flex:1}
  .overlay .obar button{background:none; border:none; color:#e2e8f0; font-size:15px; font-weight:600}
  .overlay .obody{max-width:720px; margin:0 auto; padding:14px 14px 120px}
  .savebar{position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line); padding:12px 14px calc(12px + env(safe-area-inset-bottom)); z-index:61; max-width:720px; margin:0 auto}
  .del-x{background:var(--red-soft); color:var(--red); border:none; border-radius:8px; height:40px; font-size:18px}
  .flow{display:flex; align-items:stretch; gap:6px; overflow-x:auto; padding-bottom:4px}
  .flow .step{flex:1; min-width:78px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:10px 8px; text-align:center}
  .flow .step .n{font-family:var(--mono); font-size:22px; font-weight:700; color:var(--primary)}
  .flow .step .l{font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--muted); font-weight:700; margin-top:2px}
  .flow .arw{display:flex; align-items:center; color:var(--line); font-size:18px}
  .alertbox{border-left:4px solid var(--amber); background:var(--amber-soft); color:#7c3f04; border-radius:10px; padding:10px 12px; margin-bottom:8px; font-size:13.5px}
  .alertbox.red{border-color:var(--red); background:var(--red-soft); color:#991b1b}
  .alertbox.blue{border-color:var(--blue); background:var(--blue-soft); color:#1e40af}
  .empty{text-align:center; color:var(--muted); padding:34px 12px; font-size:14px}
  .empty .big{font-size:40px; margin-bottom:8px}
  .divide{height:1px; background:var(--line); margin:10px 0}
  .kv{display:flex; justify-content:space-between; font-size:13.5px; padding:3px 0}
  .kv .k{color:var(--muted)}
  .toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(96px + env(safe-area-inset-bottom)); background:#111827; color:#fff; padding:10px 16px; border-radius:10px; font-size:13.5px; z-index:80; box-shadow:0 6px 20px rgba(0,0,0,.3); max-width:90%}
  .seg{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:3px; gap:3px; margin-bottom:10px}
  .seg button{flex:1; border:none; background:none; padding:8px; font-size:12.5px; font-weight:700; color:var(--muted); border-radius:8px}
  .seg button.on{background:var(--surface); color:var(--primary); box-shadow:var(--shadow)}
  progress{width:100%; height:8px; border-radius:6px; overflow:hidden; -webkit-appearance:none; appearance:none}
  progress::-webkit-progress-bar{background:var(--line); border-radius:6px}
  progress::-webkit-progress-value{background:var(--primary); border-radius:6px}

  /* ===== AUTH ===== */
  #authGate{
    position:fixed; inset:0; z-index:9999; background:var(--bg);
    display:flex; align-items:center; justify-content:center;
    padding:24px calc(18px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
  }
  .auth-card{
    width:min(100%,420px); background:var(--surface); border:1px solid var(--line);
    border-radius:18px; box-shadow:0 12px 34px rgba(15,23,42,.14); padding:22px;
  }
  .auth-brand{font-weight:900; font-size:18px; letter-spacing:.4px; color:var(--ink); margin-bottom:4px}
  .auth-brand span{color:var(--primary)}
  .auth-sub{color:var(--muted); font-size:13px; margin-bottom:18px}
  .auth-error{display:none; margin-top:10px; font-size:13px; color:var(--red); background:var(--red-soft); padding:9px 10px; border-radius:9px}
  .auth-pass{position:relative}
  .auth-pass input{padding-right:48px}
  .auth-eye{position:absolute; right:8px; top:50%; transform:translateY(-50%); border:0; background:transparent; font-size:18px; min-width:38px; min-height:38px}
  #appShell{display:none}
  .user-pill{display:flex;align-items:center;gap:7px;color:#cbd5e1;font-size:11px;max-width:145px}
  .user-pill .email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .logout-btn{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12); color:#fff; padding:7px 9px; border-radius:8px; font-size:11px; font-weight:700}

</style>
</head>
<body>
<div id="authGate">
  <div class="auth-card">
    <div class="auth-brand">GRUPO <span>AKS</span></div>
    <div class="auth-sub">Acesso restrito ao sistema Gestão AKS</div>

    <form id="loginForm">
      <label class="f" for="loginEmail">E-mail</label>
      <input id="loginEmail" type="email" autocomplete="username" inputmode="email" placeholder="seuemail@empresa.com" required>

      <label class="f" for="loginPassword">Senha</label>
      <div class="auth-pass">
        <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Sua senha" required>
        <button class="auth-eye" type="button" id="togglePassword" aria-label="Mostrar ou ocultar senha">👁</button>
      </div>

      <button class="btn primary block" id="loginBtn" type="submit" style="margin-top:16px">Entrar</button>
      <div class="auth-error" id="loginError"></div>
    </form>
  </div>
</div>

<div id="appShell">

<header>
  <div class="brand">GRUPO <span>AKS</span></div>
  <div class="ttl" id="hdrTitle">Início</div>
  <div class="user-pill" title="Usuário conectado"><span class="email" id="authUserEmail"></span></div>
  <button class="logout-btn" onclick="Auth.logout()" aria-label="Sair do sistema">Sair</button>
  <button class="gear" onclick="App.openSettings()" aria-label="Configurações">&#9881;</button>
</header>

<main id="view"></main>

<button class="fab" id="fab" onclick="App.fabAction()" aria-label="Adicionar">+</button>

<nav class="tabs">
  <button data-tab="home"    class="active" onclick="App.go('home')"><span class="ic">&#9707;</span>Início</button>
  <button data-tab="visitas" onclick="App.go('visitas')"><span class="ic">&#9678;</span>Visitas</button>
  <button data-tab="orcamentos" onclick="App.go('orcamentos')"><span class="ic">&#9636;</span>Propostas</button>
  <button data-tab="obras"   onclick="App.go('obras')"><span class="ic">&#9965;</span>Obras</button>
</nav>

<div id="overlayRoot"></div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ===== AUTH / SUPABASE ===== */
const SUPABASE_URL = 'https://lrxjtatulzygbveixmjv.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_9xdeJnGwprnvlg7ruRRzWw_m1rCGfP7';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

const Auth = {
  async init(){
    const { data: { session } } = await sb.auth.getSession();
    this.applySession(session);

    sb.auth.onAuthStateChange((_event, newSession) => {
      this.applySession(newSession);
    });
  },

  applySession(session){
    const gate = document.getElementById('authGate');
    const shell = document.getElementById('appShell');
    const email = document.getElementById('authUserEmail');

    if(session && session.user){
      gate.style.display = 'none';
      shell.style.display = 'block';
      email.textContent = session.user.email || '';
      setTimeout(()=>{ try{ App.go(TAB || 'home'); }catch(e){} },0);
    }else{
      shell.style.display = 'none';
      gate.style.display = 'flex';
      email.textContent = '';
      const p = document.getElementById('loginPassword');
      if(p) p.value = '';
    }
  },

  async login(email,password){
    const err = document.getElementById('loginError');
    const btn = document.getElementById('loginBtn');
    err.style.display='none';
    btn.disabled=true;
    btn.textContent='Entrando...';

    const { error } = await sb.auth.signInWithPassword({ email, password });

    btn.disabled=false;
    btn.textContent='Entrar';

    if(error){
      err.textContent = 'E-mail ou senha inválidos.';
      err.style.display='block';
      return false;
    }
    return true;
  },

  async logout(){
    await sb.auth.signOut();
  }
};
window.Auth = Auth;

document.addEventListener('DOMContentLoaded', ()=>{
  const form = document.getElementById('loginForm');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    await Auth.login(email,password);
  });

  document.getElementById('togglePassword').addEventListener('click', ()=>{
    const p = document.getElementById('loginPassword');
    p.type = p.type === 'password' ? 'text' : 'password';
  });

  Auth.init();
});

/* ===== STORE ===== */
const KEY='gestao_aks_v1';
const uid=()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const defaults=()=>({
  empresa:{nome:'KVAR Automattic — Grupo AKS', resp:'Eng. Euclides Viana — CREA-PA 17184 D', tel:''},
  colaboradores:[],
  visitas:[], orcamentos:[], obras:[]
});
let DB=load();
function load(){ try{const r=JSON.parse(localStorage.getItem(KEY)); return r?{...defaults(),...r}:defaults();}catch(e){return defaults();} }
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }

/* ===== HELPERS ===== */
function fmtDate(d){ if(!d) return '—'; const p=d.split('-'); return p.length===3? p[2]+'/'+p[1]+'/'+p[0]:d; }
function fmtDateTime(d,t){ return fmtDate(d)+(t?' '+t:''); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysLeft(iso){ if(!iso) return null; const a=new Date(iso+'T23:59:59'); const b=new Date(); return Math.ceil((a-b)/86400000); }
function esc(s){ return (s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
function waNumber(tel){ let n=(tel||'').replace(/\D/g,''); if(n.length && n.length<=11) n='55'+n; return n; }

/* ===== STATE ===== */
let TAB='home';
let filters={orc:'todos'};

/* ===== APP ===== */
const App={
  go(t){ TAB=t; document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); document.getElementById('hdrTitle').textContent=({home:'Início',visitas:'Visitas',orcamentos:'Propostas',obras:'Obras'})[t]; document.getElementById('fab').style.display= t==='home'?'none':'flex'; render(); window.scrollTo(0,0); },
  fabAction(){ if(TAB==='visitas') this.editVisita(); else if(TAB==='orcamentos') this.editOrc(); else if(TAB==='obras') this.editObra(); },

  /* --- VISITAS --- */
  editVisita(id){
    const v = id? DB.visitas.find(x=>x.id===id) : {id:uid(), cliente:'',endereco:'',contato:'',data:todayISO(),hora:'08:00',responsavel:DB.empresa.resp||'',colab:[],alarme:60,obs:'',status:'Agendada',notified:false, _new:!id};
    openEditor('Visita técnica', renderVisitaForm(v), ()=>{
      readVisitaForm(v);
      if(!v.cliente){ toast('Informe o cliente'); return false; }
      const i=DB.visitas.findIndex(x=>x.id===v.id);
      if(i>=0) DB.visitas[i]=v; else DB.visitas.unshift(v);
      save(); toast('Visita salva'); return true;
    });
  },
  setVisitaStatus(id,st){ const v=DB.visitas.find(x=>x.id===id); if(!v)return; v.status=st; save(); render(); },
  gerarProposta(id){
    const v=DB.visitas.find(x=>x.id===id); if(!v)return;
    const o={id:uid(),numero:nextOrcNum(),cliente:v.cliente,endereco:v.endereco,contato:v.contato,origemVisita:v.id,
      descricao:'A partir da visita técnica de '+fmtDate(v.data),
      itens:[], status:'Proposta gerada', dataRetorno:'',dataAprov:'', criado:todayISO()};
    DB.orcamentos.unshift(o); save();
    toast('Proposta gerada'); this.go('orcamentos'); setTimeout(()=>this.editOrc(o.id),200);
  },
  avisarWhats(id){
    const v=DB.visitas.find(x=>x.id===id); if(!v)return;
    openEditor('Avisar colaboradores', renderAvisoView(v), null, 'Fechar');
  },

  /* --- PROPOSTAS --- */
  editOrc(id){
    const o = id? DB.orcamentos.find(x=>x.id===id) : {id:uid(),numero:nextOrcNum(),cliente:'',endereco:'',contato:'',descricao:'',itens:[],status:'Proposta gerada',dataRetorno:'',dataAprov:'',criado:todayISO(),_new:!id};
    openEditor('Proposta '+ (o.numero||''), renderOrcForm(o), ()=>{
      readOrcForm(o);
      if(!o.cliente){ toast('Informe o cliente'); return false; }
      const i=DB.orcamentos.findIndex(x=>x.id===o.id);
      if(i>=0) DB.orcamentos[i]=o; else DB.orcamentos.unshift(o);
      save(); toast('Proposta salva'); return true;
    });
  },
  setOrcStatus(id,st){
    const o=DB.orcamentos.find(x=>x.id===id); if(!o)return;
    o.status=st;
    if(st==='Aguardando retorno' && !o.dataRetorno) o.dataRetorno=todayISO();
    if(st==='Aprovado' && !o.dataAprov) o.dataAprov=todayISO();
    save(); render();
  },
  gerarObra(id){
    const o=DB.orcamentos.find(x=>x.id===id); if(!o)return;
    if(DB.obras.some(b=>b.orcamento===o.id)){ toast('Já existe obra desta proposta'); this.go('obras'); return; }
    const ob={id:uid(),orcamento:o.id,cliente:o.cliente,descricao:o.descricao||('Execução — Prop '+o.numero),
      inicio:todayISO(), prazo:'', colab:[], status:'Planejada',
      pendencias:(o.itens||[]).filter(it=>it.d).map(it=>({t:it.d,ok:false})),
      medicoes:[], criado:todayISO()};
    DB.obras.unshift(ob); save();
    toast('Obra enviada para manutenção'); this.go('obras'); setTimeout(()=>this.editObra(ob.id),200);
  },

  /* --- OBRAS --- */
  editObra(id){
    const o = id? DB.obras.find(x=>x.id===id) : {id:uid(),cliente:'',descricao:'',inicio:todayISO(),prazo:'',colab:[],status:'Planejada',pendencias:[],medicoes:[],criado:todayISO(),_new:!id};
    openEditor('Obra', renderObraForm(o), ()=>{
      readObraForm(o);
      if(!o.cliente){ toast('Informe o cliente'); return false; }
      const i=DB.obras.findIndex(x=>x.id===o.id);
      if(i>=0) DB.obras[i]=o; else DB.obras.unshift(o);
      save(); toast('Obra salva'); return true;
    });
  },
  setObraStatus(id,st){ const o=DB.obras.find(x=>x.id===id); if(!o)return; o.status=st; save(); render(); },
  togglePend(oid,i){ const o=DB.obras.find(x=>x.id===oid); if(!o)return; o.pendencias[i].ok=!o.pendencias[i].ok; save(); render(); },
  addMedicao(id){
    const o=DB.obras.find(x=>x.id===id); if(!o)return;
    const p=prompt('% executado nesta medição (0-100):','');
    if(p===null)return; const pc=Math.max(0,Math.min(100,parseFloat(p)||0));
    const nota=prompt('Observação da medição (opcional):','')||'';
    o.medicoes.unshift({data:todayISO(),pc,nota});
    if(pc>=100) o.status='Concluída'; else if(o.status==='Planejada') o.status='Em andamento';
    save(); render();
  },

  /* --- SETTINGS --- */
  openSettings(){ openEditor('Configurações', renderSettings(), ()=>{ readSettings(); save(); toast('Configurações salvas'); return true; }); },
  addColab(){ readSettings(); DB.colaboradores.push({id:uid(),nome:'',tel:''}); refreshEditorBody(renderSettings()); },
  delColab(i){ readSettings(); DB.colaboradores.splice(i,1); refreshEditorBody(renderSettings()); },
  exportData(){ const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='backup_aks_'+todayISO()+'.json'; a.click(); },
  importData(){ const inp=document.createElement('input'); inp.type='file'; inp.accept='.json'; inp.onchange=e=>{ const f=e.target.files[0]; const r=new FileReader(); r.onload=()=>{ try{DB={...defaults(),...JSON.parse(r.result)}; save(); closeEditor(); render(); toast('Dados importados');}catch(x){toast('Arquivo inválido');} }; r.readAsText(f); }; inp.click(); },
  reqNotify(){ if('Notification' in window) Notification.requestPermission().then(p=>toast(p==='granted'?'Alarmes ativados':'Permissão negada')); }
};

/* ===== UTIL CALC ===== */
function nextOrcNum(){ const yr=new Date().getFullYear(); const n=DB.orcamentos.filter(o=>(o.numero||'').includes('/'+yr)).length+1; return String(n).padStart(3,'0')+'/'+yr; }
function obraProgress(o){
  if(o.medicoes && o.medicoes.length) return o.medicoes[0].pc;
  if(o.pendencias && o.pendencias.length){ const done=o.pendencias.filter(p=>p.ok).length; return Math.round(done/o.pendencias.length*100); }
  return 0;
}

/* ===== CHIPS ===== */
function orcChip(s){ const m={'Proposta gerada':'c-slate','Aguardando retorno':'c-amber','Aprovado':'c-green','Reprovado':'c-red'}; return '<span class="chip '+(m[s]||'c-slate')+'">'+s+'</span>'; }
function visitaChip(s){ const m={'Agendada':'c-blue','Realizada':'c-green','Cancelada':'c-red'}; return '<span class="chip '+(m[s]||'c-slate')+'">'+s+'</span>'; }
function obraChip(s){ const m={'Planejada':'c-slate','Em andamento':'c-amber','Concluída':'c-green'}; return '<span class="chip '+(m[s]||'c-slate')+'">'+s+'</span>'; }

  '<button class="btn sm block" onclick="App.reqNotify()">Ativar notificações de visita</button>'+
  '<div class="small muted" style="margin-top:6px">Alarmes disparam enquanto o app estiver aberto. Push automático em segundo plano precisa do worker no VPS.</div>'+
  '<div class="eyebrow" style="margin-top:16px">Dados</div>'+
  '<div class="btn-grid"><button class="btn sm" onclick="App.exportData()">Exportar backup</button><button class="btn sm" onclick="App.importData()">Importar backup</button></div>';
}
function readSettings(){
  DB.empresa.nome=val('s_nome'); DB.empresa.resp=val('s_resp'); DB.empresa.tel=val('s_tel');
  document.querySelectorAll('.col-nome').forEach(el=>{ const i=+el.dataset.i; if(DB.colaboradores[i]) DB.colaboradores[i].nome=el.value; });
  document.querySelectorAll('.col-tel').forEach(el=>{ const i=+el.dataset.i; if(DB.colaboradores[i]) DB.colaboradores[i].tel=el.value; });
}

/* ===== EDITOR OVERLAY ===== */
let editorSave=null;
function openEditor(title, bodyHtml, onSave, saveLabel){
  editorSave=onSave;
  const root=document.getElementById('overlayRoot');
  root.innerHTML='<div class="overlay">'+
    '<div class="obar"><button onclick="closeEditor()">Cancelar</button><h3>'+esc(title)+'</h3><span style="width:64px"></span></div>'+
    '<div class="obody" id="editorBody">'+bodyHtml+'</div>'+
    (onSave?'<div class="savebar"><button class="btn primary block" onclick="commitEditor()">Salvar</button></div>':'<div class="savebar"><button class="btn block" onclick="closeEditor()">'+(saveLabel||'Fechar')+'</button></div>')+
  '</div>';
  document.body.style.overflow='hidden';
}
function refreshEditorBody(html){ const b=document.getElementById('editorBody'); if(b) b.innerHTML=html; }
function commitEditor(){ if(!editorSave){ closeEditor(); return; } const ok=editorSave(); if(ok!==false){ closeEditor(); render(); } }
function closeEditor(){ document.getElementById('overlayRoot').innerHTML=''; document.body.style.overflow=''; editorSave=null; }
window.closeEditor=closeEditor; window.commitEditor=commitEditor;

/* ===== UTIL ===== */
function val(id){ const e=document.getElementById(id); return e? e.value.trim():''; }
function emptyState(ic,t,s){ return '<div class="empty"><div class="big">'+ic+'</div><b>'+t+'</b><div class="small" style="margin-top:6px">'+s+'</div></div>'; }
window.filters=filters; window.DB=DB; window.save=save; window.render=render; window.toast=toast;

/* ===== ALARMS ===== */
function checkAlarms(){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const now=new Date();
  DB.visitas.filter(v=>v.status==='Agendada' && !v.notified && v.data && v.hora).forEach(v=>{
    const dt=new Date(v.data+'T'+v.hora); const trigger=new Date(dt.getTime()-(v.alarme||0)*60000);
    if(now>=trigger && now<=dt){
      new Notification('Visita técnica — '+v.cliente, {body:(v.endereco||'')+' · '+v.hora});
      v.notified=true; save();
    }
  });
}
setInterval(checkAlarms, 30000);

/* ===== INIT ===== */
